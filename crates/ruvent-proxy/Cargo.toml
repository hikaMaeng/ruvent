[package]
name = "ruvent-proxy"
description = "Build a proxy server for end users: one upstream subscription per channel, the protocols you pick as features, your rules as hooks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["ws", "http"]
# WebSocket: `GET /v1/ws`.
ws = ["dep:axum", "axum/ws", "dep:futures-util"]
# HTTP: `POST /v1/events`, server-sent events on `GET /v1/stream`.
http = ["dep:axum", "dep:futures-util"]

[dependencies]
ruvent.workspace = true
ruvent-client.workspace = true
http.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
# Already in the lock file through axum's `ws` feature; only the tests use it directly.
tokio-tungstenite = "0.29"

[[test]]
name = "ws"
required-features = ["ws"]

[[test]]
name = "http"
required-features = ["http"]

[[test]]
name = "hooks"
required-features = ["ws", "http"]

[[example]]
name = "plain"
required-features = ["ws"]

[[example]]
name = "custom"
required-features = ["ws"]
