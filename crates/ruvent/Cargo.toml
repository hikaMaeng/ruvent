[package]
name = "ruvent"
description = "Event server core: one envelope, a claimable queue and dispatch, seven methods, a journal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
crc32fast.workspace = true
parking_lot.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
proptest.workspace = true

# Three levels, three binaries. See docs/testing.md.
[[test]]
name = "static"
path = "tests/static/main.rs"

[[test]]
name = "runtime"
path = "tests/runtime/main.rs"

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
