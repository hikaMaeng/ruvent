[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
ruvent = { path = "crates/ruvent" }
ruvent-protocol = { path = "crates/ruvent-protocol" }
ruvent-client = { path = "crates/ruvent-client" }
ruvent-proxy = { path = "crates/ruvent-proxy" }
async-trait = "0.1"
axum = "0.8"
bytes = "1"
crc32fast = "1"
form_urlencoded = "1"
futures-util = "0.3"
http = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "signal", "fs"] }
uuid = { version = "1", features = ["v7"] }
# Test-only.
proptest = "1"

# Decided once, for every crate. `cargo xtask verify` turns warnings into errors,
# so anything listed here as "warn" is a gate too.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
# A lock guard held over an await point blocks every reader for as long as
# the awaited thing takes.
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# A library does not write to the terminal.
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
exit = "deny"

[profile.release]
debug = 1
